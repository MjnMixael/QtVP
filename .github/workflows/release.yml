name: Release

# Build QtVP for Windows and Linux and publish binaries to a GitHub Release
# when a version tag (e.g. V1.2.3) is pushed.
on:
  push:
    tags:
      - 'V*'
      - 'v*'
      - 'Version_*'
  # Manual dry-run from the Actions tab: builds both OSes and uploads artifacts,
  # but only publishes a Release (and opens the Knossos PR) on a real tag.
  workflow_dispatch:

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: linux_gcc_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # QtVP uses core/gui/widgets/concurrent plus multimedia (sound/video
      # previews), so the qtmultimedia module is installed on both OSes.
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true

      # ---- Windows -------------------------------------------------------
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Package with windeployqt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $staging = "dist\QtVP"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "build\QtVP.exe" $staging
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-translations --compiler-runtime `
            "$staging\QtVP.exe"
          Copy-Item "README.md","LICENSE" $staging -ErrorAction SilentlyContinue
          $zip = "QtVP-$name-win64.zip"
          Compress-Archive -Path "dist\QtVP\*" -DestinationPath $zip -Force
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: QtVP-win64
          path: ${{ env.ASSET }}

      # ---- Linux ---------------------------------------------------------
      - name: Install Linux build, Qt xcb & multimedia deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ninja for the build; libgl + libxcb-* for the Qt 'xcb' platform
          # plugin; libpulse/libasound for the multimedia backend.
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev libxkbcommon-dev \
            libxcb1-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-util1 \
            libpulse0 libasound2t64

      - name: Configure & build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME:-dev}"
          appdir="$PWD/AppDir"
          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp build/QtVP "$appdir/usr/bin/QtVP"
          cp packaging/QtVP.png "$appdir/usr/share/icons/hicolor/256x256/apps/QtVP.png"
          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=QtVP"
            echo "Comment=VP archive viewer for FreeSpace Open"
            echo "Exec=QtVP"
            echo "Icon=QtVP"
            echo "Categories=Utility;"
            echo "Terminal=false"
          } > "$appdir/usr/share/applications/QtVP.desktop"

          curl -fL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"

          # Runners lack FUSE; run the AppImage tools by extracting instead.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Bundle the Qt multimedia plugins explicitly so previews work.
          export EXTRA_QT_MODULES="multimedia"
          ./linuxdeploy --appdir "$appdir" --plugin qt --output appimage

          built="$(ls -1 QtVP*.AppImage | head -n1)"
          appimage="QtVP-${name}-x86_64.AppImage"
          if [ "$built" != "$appimage" ]; then mv "$built" "$appimage"; fi

          # Knossos Linux package: a zip of the self-contained bundle. linuxdeploy
          # populated AppDir with the binary + bundled Qt and wrote qt.conf, so
          # usr/bin/QtVP finds its plugins without FUSE. -y keeps the symlinks.
          knzip="QtVP-${name}-linux-x86_64.zip"
          ( cd "$appdir" && zip -ryq "$GITHUB_WORKSPACE/$knzip" . )

          echo "APPIMAGE=$appimage" >> "$GITHUB_ENV"
          echo "KNZIP=$knzip" >> "$GITHUB_ENV"

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: QtVP-linux
          path: |
            ${{ env.APPIMAGE }}
            ${{ env.KNZIP }}

  # Publish both OS assets to the Release, but only on a real tag.
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          draft: false
          prerelease: false
          generate_release_notes: true

  # Open a pull request against the Knossos tool repo to point it at the new
  # release. Creates the QtVP entry if it isn't listed yet, otherwise patches it.
  # Runs only on a real tag, after the Release is published, and only if the
  # KNOSSOS_PAT secret is configured.
  knossos-pr:
    name: Propose Knossos update
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check for token
        id: gate
        env:
          KNOSSOS_PAT: ${{ secrets.KNOSSOS_PAT }}
        run: |
          if [ -n "$KNOSSOS_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KNOSSOS_PAT secret not set — skipping Knossos PR."
          fi

      - name: Checkout Knossos tool repo (upstream)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: KnossosNET/Knet-Tool-Repo
          ref: main
          token: ${{ secrets.KNOSSOS_PAT }}
          path: knossos

      - name: Update knet_tools.json
        if: steps.gate.outputs.enabled == 'true'
        working-directory: knossos
        env:
          TAG: ${{ github.ref_name }}
          APP_NAME: "QtVP"
          APP_DESC: "A VP archive viewer and extractor for FreeSpace Open."
          WIN_EXE_PATH: "QtVP.exe"
          LINUX_EXE_PATH: "usr/bin/QtVP"
        run: |
          set -euo pipefail
          # Strip any leading tag prefix (V, v, Version_) to get the bare version.
          export VER="$(echo "$TAG" | sed -E 's/^[^0-9]*//')"
          export DATE="$(date -u +%F)"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          export WIN_URL="$base/${APP_NAME}-${TAG}-win64.zip"
          export LINUX_URL="$base/${APP_NAME}-${TAG}-linux-x86_64.zip"
          # Create the tool entry if it doesn't exist yet, otherwise patch it in
          # place (version / last_update, windows + linux package URLs, cpu_arch
          # x64). Identical across every app's workflow, so it copies as-is.
          python3 - "knet_tools.json" <<'PY'
          import io, os, re, json, sys
          path = sys.argv[1]
          app     = os.environ["APP_NAME"]
          ver     = os.environ["VER"]
          date    = os.environ["DATE"]
          win     = os.environ["WIN_URL"]
          lin     = os.environ["LINUX_URL"]
          desc    = os.environ["APP_DESC"]
          win_exe = os.environ["WIN_EXE_PATH"]
          lin_exe = os.environ["LINUX_EXE_PATH"]

          s = io.open(path, encoding="utf-8").read()
          m = re.search(r'"name"\s*:\s*"%s"' % re.escape(app), s)

          if m:
              # Patch the existing entry in place (minimal, surgical).
              start = s.rfind("{", 0, m.start())
              depth, i, end = 0, start, None
              while i < len(s):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
                  i += 1
              if end is None:
                  sys.exit("could not find end of %s object" % app)
              block = s[start:end]
              block = re.sub(r'("version"\s*:\s*)"[^"]*"',     r'\g<1>"%s"' % ver,  block, count=1)
              block = re.sub(r'("last_update"\s*:\s*)"[^"]*"', r'\g<1>"%s"' % date, block, count=1)
              block = re.sub(r'("cpu_arch"\s*:\s*)"[^"]*"',    r'\g<1>"x64"',       block)
              block = re.sub(r'("download_url"\s*:\s*)"[^"]*win64\.zip"',
                             r'\g<1>"%s"' % win, block, count=1)
              if re.search(r'"os"\s*:\s*"linux"', block):
                  block = re.sub(r'("download_url"\s*:\s*)"[^"]*linux-x86_64\.zip"',
                                 r'\g<1>"%s"' % lin, block, count=1)
              else:
                  linux_pkg = (
                      '      {\n'
                      '        "download_url": "%s",\n'
                      '        "os": "linux",\n'
                      '        "cpu_arch": "x64",\n'
                      '        "executable_path": "%s"\n'
                      '      }' % (lin, lin_exe)
                  )
                  block, n = re.subn(r'\n([ \t]*)\}\n([ \t]*)\]',
                                     '\n\\1},\n' + linux_pkg + '\n\\2]', block, count=1)
                  if n != 1:
                      sys.exit("could not locate packages array to insert linux package")
              s2 = s[:start] + block + s[end:]
          else:
              # Create a new entry and append it to the tool array.
              entry = (
                  '  {\n'
                  '    "name": %s,\n'
                  '    "version": %s,\n'
                  '    "description": %s,\n'
                  '    "last_update": %s,\n'
                  '    "cmdline": "",\n'
                  '    "packages": [\n'
                  '      {\n'
                  '        "download_url": %s,\n'
                  '        "os": "windows",\n'
                  '        "cpu_arch": "x64",\n'
                  '        "executable_path": %s\n'
                  '      },\n'
                  '      {\n'
                  '        "download_url": %s,\n'
                  '        "os": "linux",\n'
                  '        "cpu_arch": "x64",\n'
                  '        "executable_path": %s\n'
                  '      }\n'
                  '    ]\n'
                  '  }' % (json.dumps(app), json.dumps(ver), json.dumps(desc), json.dumps(date),
                          json.dumps(win), json.dumps(win_exe), json.dumps(lin), json.dumps(lin_exe))
              )
              s2, n = re.subn(r'\n\]\s*$', ',\n' + entry + '\n]\n', s, count=1)
              if n != 1:
                  sys.exit("could not find end of tool array to append %s" % app)

          data = json.loads(s2)  # fail loudly if we produced invalid JSON
          e = [x for x in data if x.get("name") == app][0]
          assert e["version"] == ver, e["version"]
          assert e["last_update"] == date, e["last_update"]
          pkgs = dict((p.get("os"), p) for p in e["packages"])
          assert pkgs["windows"]["download_url"] == win
          assert pkgs["windows"]["cpu_arch"] == "x64"
          assert pkgs["linux"]["download_url"] == lin
          assert pkgs["linux"]["cpu_arch"] == "x64"
          assert pkgs["linux"]["executable_path"] == lin_exe

          io.open(path, "w", encoding="utf-8", newline="").write(s2)
          PY
          git --no-pager diff -- knet_tools.json

      - name: Create pull request
        if: steps.gate.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.KNOSSOS_PAT }}
          path: knossos
          push-to-fork: MjnMixael/Knet-Tool-Repo
          branch: qtvp-${{ github.ref_name }}
          base: main
          commit-message: "Update QtVP to ${{ github.ref_name }}"
          title: "Update QtVP to ${{ github.ref_name }}"
          body: |
            Automated update of **QtVP** to `${{ github.ref_name }}`.

            - Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

            Opened automatically by the QtVP release workflow.
          delete-branch: true
